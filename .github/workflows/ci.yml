name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: diachronica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diachronica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/diachronica_test
      SESSION_SECRET: ci-session-secret-with-more-than-32-characters
      RATE_LIMIT_SECRET: ci-rate-limit-secret-with-more-than-32-characters
      E2E_DEMO: "true"
      E2E_MODERATOR_PASSWORD: E2e-Test-Password-For-CI-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed:demo
      - run: pnpm admin:create e2e-admin "$E2E_MODERATOR_PASSWORD"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
