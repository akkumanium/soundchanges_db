services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diachronica
      POSTGRES_USER: diachronica
      POSTGRES_PASSWORD: diachronica
    volumes:
      - diachronica_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diachronica -d diachronica"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://diachronica:diachronica@db:5432/diachronica
    depends_on:
      db:
        condition: service_healthy
    command: ["pnpm", "db:migrate"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://diachronica:diachronica@db:5432/diachronica
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in .env}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-https://github.com/}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  diachronica_db:
